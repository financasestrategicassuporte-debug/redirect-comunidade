<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunidade Gestão Fitness Brasil</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #1a3a3a 0%, #0d2a2a 50%, #133333 100%);
    color: #fff;
  }
  .card {
    width: 100%;
    max-width: 550px;
    padding: 50px 40px 40px;
    text-align: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .icon {
    width: 90px; height: 90px;
    margin: 0 auto 20px;
    background: #25d366;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 52px; height: 52px; fill: #fff; }
  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 14px;
  }
  .badge {
    display: inline-block;
    margin-bottom: 16px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0d2a2a;
    background: #25d366;
    border-radius: 999px;
  }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 14px; }
  .sub {
    font-size: 16px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 30px;
  }
  .sub strong { color: #25d366; }
  .row { display: flex; gap: 14px; margin-bottom: 14px; }
  .btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 18px 16px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn-android { background: #25d366; }
  .btn-ios { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25); }
  .btn-copy {
    width: 100%;
    padding: 16px;
    background: linear-gradient(90deg, #667eea 0%, #9b59b6 100%);
  }
  .btn-copy svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; flex-shrink: 0; }
  .btn-copy .txt { display: flex; flex-direction: column; text-align: left; line-height: 1.3; }
  .btn-copy .txt small { font-size: 13px; font-weight: 600; opacity: .8; }
  .countdown { margin-top: 34px; font-size: 16px; color: rgba(255, 255, 255, 0.55); }
  .countdown b { color: #25d366; font-size: 18px; }
  @media (max-width: 480px) {
    .card { padding: 40px 22px 32px; }
    h1 { font-size: 22px; }
    .row { flex-direction: column; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.31l-.34-.2-3.57.94.95-3.48-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.23-9.43 9.44-9.43a9.37 9.37 0 0 1 6.67 2.77 9.37 9.37 0 0 1 2.76 6.67c0 5.2-4.24 9.43-9.44 9.43zm8.03-17.46A11.27 11.27 0 0 0 12.05.72C5.79.72.7 5.8.7 12.06c0 2 .52 3.95 1.52 5.67L.6 23.28l5.69-1.49a11.33 11.33 0 0 0 5.42 1.38h.01c6.25 0 11.34-5.09 11.35-11.34 0-3.03-1.18-5.88-3.32-8.02z"/></svg>
    </div>

    <p class="eyebrow">Comunidade Gestão Fitness Brasil</p>
    <span class="badge">Vagas 100% gratuitas</span>
    <h1>Acessando a Comunidade.....</h1>
    <p class="sub">
      Você está sendo redirecionado para a comunidade no WhatsApp.<br>
      <strong>Sua vaga é 100% gratuita.</strong> Se não abrir automaticamente, use os botões abaixo.
    </p>

    <div class="row">
      <a class="btn btn-android" id="btnAndroid" href="#">Android</a>
      <a class="btn btn-ios" id="btnIos" href="#">iPhone / iOS</a>
    </div>

    <button class="btn btn-copy" id="btnCopy" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/></svg>
      <span class="txt">
        <span id="copyLabel">Copiar Link da Comunidade</span>
        <small>Cole no WhatsApp para acessar</small>
      </span>
    </button>

    <p class="countdown" id="countdown">Redirecionando automaticamente em <b id="secs">7</b>s...</p>
  </main>

<script>
  var CODE = "KJnTnqw3SjlCctpaxCAb8m";
  var LINK = "https://chat.whatsapp.com/" + CODE;
  var ANDROID = "intent://chat/?code=" + CODE +
    "#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=" +
    encodeURIComponent(LINK) + ";end";

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);

  document.getElementById("btnAndroid").href = ANDROID;
  document.getElementById("btnIos").href = LINK;

  document.getElementById("btnCopy").addEventListener("click", function () {
    var label = document.getElementById("copyLabel");
    function done() {
      label.textContent = "Link copiado!";
      setTimeout(function () { label.textContent = "Copiar Link da Comunidade"; }, 2500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(LINK).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = LINK;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  });

  var s = 7;
  var secsEl = document.getElementById("secs");
  var timer = setInterval(function () {
    s--;
    if (s <= 0) {
      clearInterval(timer);
      document.getElementById("countdown").textContent = "Abrindo o WhatsApp...";
      window.location.href = isAndroid ? ANDROID : LINK;
      return;
    }
    secsEl.textContent = s;
  }, 1000);
</script>
</body>
</html>
